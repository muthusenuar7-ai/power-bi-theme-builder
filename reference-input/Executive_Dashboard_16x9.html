<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datacense — Executive Command Center · 16:9</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
:root{
  --navy:#0B1F3A; --ink:#081426; --cyan:#00B4D8; --teal:#0093B2; --gold:#F2C811;
  --green:#2ec27e; --red:#ef5d5d; --amber:#f6a609;
  --panel:#10263f; --panel2:#15314f; --line:rgba(255,255,255,.08);
  --txt:#e8eef7; --mut:#8aa2c0; --mut2:#5e7796;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter Tight',sans-serif; background:#04080f; color:var(--txt);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 16:9 stage that scales to fit */
#viewport{position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center}
#stage{
  width:1920px; height:1080px; transform-origin:center center; position:relative;
  background:
    radial-gradient(1400px 700px at 82% -8%, rgba(0,180,216,.10), transparent 60%),
    radial-gradient(1000px 560px at -8% 112%, rgba(242,200,17,.06), transparent 55%),
    var(--ink);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 30px 120px rgba(0,0,0,.6);
}

/* HEADER */
.hdr{display:flex;align-items:center;gap:18px;padding:18px 34px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--teal));
  display:grid;place-items:center;font-family:'Sora';font-weight:800;color:var(--ink);font-size:20px;box-shadow:0 6px 22px rgba(0,180,216,.35)}
.brand h1{font-family:'Sora';font-size:20px;font-weight:700;letter-spacing:-.3px}
.brand span{font-size:11.5px;color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
.hmeta{margin-left:auto;display:flex;gap:26px;align-items:center}
.hmeta .m{text-align:right}
.hmeta .m b{font-family:'Sora';font-size:16px;display:block}
.hmeta .m small{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--green);
  border:1px solid rgba(46,194,126,.3);padding:6px 12px;border-radius:20px;background:rgba(46,194,126,.08)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(46,194,126,.5)}50%{opacity:.5;box-shadow:0 0 0 5px rgba(46,194,126,0)}}

/* BODY = left rail + content */
.body{flex:1;display:flex;min-height:0}
.rail{width:228px;border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:6px;background:rgba(8,18,34,.4)}
.railhdr{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:6px 8px 4px}
.dtab{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;transition:.16s}
.dtab svg{width:18px;height:18px}
.dtab:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.dtab.active{background:linear-gradient(135deg,rgba(0,180,216,.18),rgba(0,147,178,.1));color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan)}

.content{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 22px 18px}

/* SLICER BAR */
.slicer{display:flex;align-items:center;gap:10px;padding:10px 0 12px;flex-wrap:wrap}
.slicer .sl-lab{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-right:2px}
.chipset{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.chip{padding:6px 13px;font-size:11.5px;font-weight:600;border-radius:7px;color:var(--mut);cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{color:var(--txt)}
.chip.on{background:linear-gradient(135deg,var(--cyan),var(--teal));color:var(--ink)}
.sl-div{width:1px;height:24px;background:var(--line);margin:0 4px}
.pagepills{margin-left:auto;display:flex;gap:6px}
.ppill{padding:7px 14px;font-size:11.5px;font-weight:600;border-radius:8px;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--mut);transition:.15s}
.ppill:hover{border-color:var(--teal);color:var(--txt)}
.ppill.active{background:var(--gold);color:var(--ink);border-color:transparent}
.reset{font-size:11px;color:var(--mut2);cursor:pointer;padding:6px 10px;border-radius:7px}
.reset:hover{color:var(--cyan)}

.ptitle{font-family:'Sora';font-size:17px;font-weight:700;letter-spacing:-.3px;margin:2px 0 1px}
.psub{font-size:11.5px;color:var(--mut);margin-bottom:10px}

/* the actual report area fills remaining space */
.report{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.kpi.g::before{background:var(--gold)}.kpi.gr::before{background:var(--green)}.kpi.rd::before{background:var(--red)}.kpi.am::before{background:var(--amber)}
.kpi .lab{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .val{font-family:'Sora';font-size:21px;font-weight:700;margin:5px 0 3px;letter-spacing:-.5px}
.kpi .sub{font-size:10px;color:var(--mut2)}
.chg{font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:2px}
.chg.up{color:var(--green)}.chg.down{color:var(--red)}

/* chart grid fills rest */
.grid{display:grid;gap:10px;flex:1;min-height:0}
.g23{grid-template-columns:1.7fr 1fr}
.g32{grid-template-columns:1fr 1.7fr}
.g2{grid-template-columns:1fr 1fr}
.rows2{grid-template-rows:1fr 1fr}
.panel{background:linear-gradient(160deg,var(--panel),rgba(21,49,79,.6));border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.panel h3{font-family:'Sora';font-size:13px;font-weight:600}
.panel .ph small{font-size:10px;color:var(--mut)}
.tag{font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(0,180,216,.14);color:var(--cyan);text-transform:uppercase;letter-spacing:.4px}
.cwrap{position:relative;flex:1;min-height:0}

table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6.5px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
tr:hover td{background:rgba(0,180,216,.04)}
td.num{font-family:'JetBrains Mono';text-align:right}
.pill{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block}
.pill.ok{background:rgba(46,194,126,.15);color:var(--green)}
.pill.warn{background:rgba(246,166,9,.15);color:var(--amber)}
.pill.bad{background:rgba(239,93,93,.15);color:var(--red)}
.bars-pad{display:flex;flex-direction:column;justify-content:center;flex:1;gap:11px}
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px}
.barrow{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:1px}
.gauge-num{font-family:'Sora';font-weight:700}
.scrollt{flex:1;overflow:auto}

.ratiowrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:13px}

#ar{position:fixed;left:14px;bottom:12px;font-size:10.5px;color:var(--mut2);z-index:99}
</style>
</head>

const GRID={color:'rgba(255,255,255,.06)'};
let charts=[];const clearCharts=()=>{charts.forEach(c=>c.destroy());charts=[]};
const mk=(id,cfg)=>{const c=new Chart(document.getElementById(id),cfg);charts.push(c);return c;};

/* ===== option factories ===== */
const baseOpt=()=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:9,padding:9,font:{size:10}},position:'bottom'}}});

const barOpt=()=>{const o=baseOpt();o.scales={x:{grid:GRID},y:{grid:GRID,beginAtZero:true}};return o;};
const stackOpt=()=>{const o=barOpt();o.scales={x:{stacked:true,grid:GRID},y:{stacked:true,grid:GRID}};return o;};
const doughOpt=()=>{const o=baseOpt();o.cutout='60%';return o;};

function ratioBars(rs){return `<div class="ratiowrap">`+rs.map(r=>{const good=r.inv?r.v<=r.t:r.v>=r.t;const pct=r.pct?Math.min(r.v/(r.t*1.5)*100,100):Math.min(r.v/(r.t*1.5)*100,100);return `<div><div class="barrow"><span>${r.l}</span><span class="gauge-num" style="color:${good?'var(--green)':'var(--amber)'}">${r.v}${r.pct?'%':''} <small style="color:var(--mut2)">/ ${r.t}${r.pct?'%':''}</small></span></div><div class="bar"><i style="width:${pct}%;background:${good?'linear-gradient(90deg,var(--green),var(--teal))':'linear-gradient(90deg,var(--amber),var(--gold))'}"></i></div></div>`}).join('')+`</div>`;}
function fillBars(fr){return `<div class="bars-pad">`+fr.map(f=>`<div><div class="barrow"><span>${f.l}</span><span class="gauge-num">${f.v}%</span></div><div class="bar"><i style="width:${f.v}%;background:${f.v>=92?'linear-gradient(90deg,var(--green),var(--teal))':f.v>=88?'linear-gradient(90deg,var(--amber),var(--gold))':'linear-gradient(90deg,var(--red),var(--amber))'}"></i></div></div>`).join('')+`</div>`;}

  mk('i_turns',{type:'bar',data:{labels:d.category.lab,datasets:[{label:'Turns',data:[8.2,12.4,6.1,4.2,9.8],backgroundColor:C.cyan,borderRadius:5},{label:'Days Supply',data:[44,29,60,87,37],backgroundColor:C.gold,borderRadius:5}]},options:barOpt()});},
 'inventory-1':()=>{const d=DATA.inventory;
  mk('i_age',{type:'bar',data:{labels:d.aging.lab,datasets:[{data:d.aging.v,backgroundColor:[C.green,C.cyan,C.gold,C.amber,C.red],borderRadius:6}]},options:barOpt()});
  mk('i_dead',{type:'bar',data:{labels:d.deadstock.map(x=>x.l),datasets:[{data:d.deadstock.map(x=>x.v),backgroundColor:C.red,borderRadius:6}]},options:{...barOpt(),indexAxis:'y'}});
  mk('i_abcmove',{type:'bar',data:{labels:['A','B','C'],datasets:[{label:'Fast',data:[58,32,18],backgroundColor:C.green,borderRadius:5},{label:'Slow',data:[14,28,42],backgroundColor:C.amber,borderRadius:5}]},options:stackOpt()});
  mk('i_balance',{type:'bar',data:{labels:d.category.lab,datasets:[{label:'Stockout',data:[2.1,0.8,3.4,4.2,1.6],backgroundColor:C.red,borderRadius:5},{label:'Excess',data:[6,3,9,14,4],backgroundColor:C.amber,borderRadius:5}]},options:barOpt()});},
 'inventory-2':()=>{const d=DATA.inventory;
  mk('i_wh',{type:'bar',data:{labels:d.warehouses.map(w=>w[0]),datasets:[{data:d.warehouses.map(w=>w[2]),backgroundColor:C.cyan,borderRadius:6}]},options:barOpt()});
  mk('i_space',{type:'bar',data:{labels:d.warehouses.map(w=>w[0]),datasets:[{data:[88,76,94,71,82],backgroundColor:[88,76,94,71,82].map(v=>v>90?C.red:v>80?C.amber:C.green),borderRadius:6}]},options:barOpt()});
  mk('i_replen',{type:'bar',data:{labels:d.warehouses.map(w=>w[0]),datasets:[{label:'Below ROP',data:[12,8,18,6,14],backgroundColor:C.red,borderRadius:5},{label:'Healthy',data:[140,98,121,76,84],backgroundColor:C.green,borderRadius:5}]},options:stackOpt()});}
};

/* ================= SLICERS & NAV ================= */
const subMap={
 'sales-0':'Group revenue health, margin and pipeline coverage for the board.',
 'sales-1':'How opportunities move from lead to close — conversion and bookings.',
 'sales-2':'Where revenue and margin come from across products and regions.',
 'finance-0':'Profitability bridge, expense structure and core ratios at a glance.',
 'finance-1':'Cash generation, working capital and liquidity for treasury review.',
 'finance-2':'Spend discipline — budget adherence, variance and statutory GST.',
 'hr-0':'Workforce size, shape and diversity across the organisation.',
 'hr-1':'Attrition hotspots and retention risk needing leadership attention.',
 'hr-2':'Engagement drivers, learning investment and performance spread.',
 'supply-0':'Service-level reliability and delivery performance across hubs.',
 'supply-1':'Supplier reliability, quality and spend concentration.',
 'supply-2':'Freight economics, network flow and sustainability metrics.',
 'inventory-0':'Stock value, classification and turnover efficiency.',
 'inventory-1':'Aging, dead-stock exposure and stockout-vs-excess balance.',
 'inventory-2':'Distribution-centre level stock, accuracy and replenishment.'};

let state={dom:'sales',page:0,fy:'FY 25–26',qtr:'YTD',region:'All'};
const SLICERS=[
 {key:'fy',lab:'Fiscal Year',opts:['FY 25–26','FY 24–25']},
 {key:'qtr',lab:'Quarter',opts:['YTD','Q1','Q2','Q3','Q4']},
 {key:'region',lab:'Region',opts:['All','West','South','North','East']}];

function buildRail(){
 document.getElementById('rail').innerHTML='<div class="railhdr">Domains</div>'+DOMAINS.map(d=>
  `<div class="dtab ${d.id===state.dom?'active':''}" data-dom="${d.id}">${ICONS[d.id]}${d.name}</div>`).join('');
}
function buildSlicer(){
 const dom=DOMAINS.find(d=>d.id===state.dom);
 let html=SLICERS.map(s=>`<span class="sl-lab">${s.lab}</span><div class="chipset" data-key="${s.key}">${s.opts.map(o=>`<span class="chip ${state[s.key]===o?'on':''}" data-val="${o}">${o}</span>`).join('')}</div><span class="sl-div"></span>`).join('');
 html+=`<span class="reset" id="resetBtn">↺ Reset</span>`;
 html+=`<div class="pagepills">${dom.pages.map((p,i)=>`<span class="ppill ${i===state.page?'active':''}" data-page="${i}">${p}</span>`).join('')}</div>`;
 document.getElementById('slicer').innerHTML=html;
}
function render(){
 clearCharts();
 const dom=DOMAINS.find(d=>d.id===state.dom);const key=state.dom+'-'+state.page;
 document.getElementById('ptitle').textContent=dom.name+' · '+dom.pages[state.page];
 const flt=(state.qtr!=='YTD'||state.region!=='All')?`  ·  Filtered: ${state.qtr}${state.region!=='All'?' / '+state.region:''}`:'';
 document.getElementById('psub').textContent=subMap[key]+flt;
 document.getElementById('report').innerHTML=PAGES[key]();
 requestAnimationFrame(()=>{if(RENDER[key])RENDER[key]();});
}
document.getElementById('rail').addEventListener('click',e=>{const t=e.target.closest('.dtab');if(!t)return;state.dom=t.dataset.dom;state.page=0;buildRail();buildSlicer();render();});
document.getElementById('slicer').addEventListener('click',e=>{
 const chip=e.target.closest('.chip');
 if(chip){state[chip.closest('.chipset').dataset.key]=chip.dataset.val;buildSlicer();render();return;}
 const pp=e.target.closest('.ppill');
 if(pp){state.page=+pp.dataset.page;buildSlicer();render();return;}
 if(e.target.id==='resetBtn'){state.qtr='YTD';state.region='All';state.fy='FY 25–26';buildSlicer();render();}
});

scaleStage();buildRail();buildSlicer();render();
</script>
</body>
